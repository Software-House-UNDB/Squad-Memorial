# Respeita o https que o túnel/proxy já terminou (senão o Django acha que é http e o admin falha no CSRF)
map $http_x_forwarded_proto $proto_real {
    default $scheme;
    https   https;
}

upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Uploads de vídeo pelo admin podem ser grandes
    client_max_body_size 2G;
    client_body_timeout 600s;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- API e admin (Django) ----------
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_real;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- Fotos e vídeos ----------
    # O nginx já responde requisições Range, então o <video> do totem
    # consegue avançar/voltar sem baixar o arquivo inteiro.
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
    }

    # Arquivos estáticos do admin do Django
    location /static/ {
        alias /var/www/static/;
        expires 30d;
    }

    # ---------- App do totem (SPA) ----------
    # Arquivos com hash no nome: cache eterno
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker e index nunca em cache, senão o totem não recebe versões novas
    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        types { application/javascript js; application/manifest+json webmanifest; text/html html; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}