# Desenvolvimento (docker-compose.yml). Mesmas rotas do memorial que a produção: /memorial/..., /administracao/
# e /check-in/. Em produção o resto do domínio é do site atual da escola.
upstream backend {
    server backend:8000;
}

# Respeita o https que o túnel/proxy já terminou (senão o Django acha que é http e o admin falha no CSRF)
map $http_x_forwarded_proto $proto_real {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Padrão pequeno; cada rota que recebe arquivo abre o seu limite (abaixo).
    client_max_body_size 1m;
    client_body_timeout 600s;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- Django ----------
    # Check-in pelo celular: até 3 fotos de 10 MB cada.
    location = /memorial/api/checkin/ {
        client_max_body_size 30m;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_real;
        proxy_read_timeout 120s;
    }

    location /memorial/api/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_real;
        proxy_read_timeout 60s;
    }

    # Admin: envio de vídeos grandes.
    location /memorial/admin/ {
        client_max_body_size 2G;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_real;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Painel da administração (precisa de login, ver backend/memorial/administracao.py e gestao.py).
    # Recebe os mesmos envios do /admin, inclusive vídeos grandes.
    location = /administracao {
        return 301 /administracao/;
    }
    location /administracao/ {
        client_max_body_size 2G;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_real;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- Fotos e vídeos ----------
    # O nginx já responde requisições Range, então o <video> do totem
    # consegue avançar/voltar sem baixar o arquivo inteiro.
    location /memorial/media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
    }

    # Fotos de ex-alunos: cache curto, para um pedido de remoção chegar logo aos totens.
    location /memorial/media/alunos/ {
        alias /var/www/media/alunos/;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # Arquivos estáticos do admin do Django
    location /memorial/static/ {
        alias /var/www/static/;
        expires 30d;
    }

    # ---------- Apps ----------
    # Arquivos com hash no nome: cache eterno
    location /memorial/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker e páginas nunca em cache, senão o totem não recebe versões novas
    location ~ ^/memorial/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        types { application/javascript js; application/manifest+json webmanifest; text/html html; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Check-in pelo celular (endereço do QR Code): página própria, fora do service worker do totem
    location = /check-in {
        return 301 /check-in/$is_args$args;
    }
    location /check-in/ {
        add_header Cache-Control "no-cache";
        try_files /memorial/checkin/index.html =404;
    }
    # Endereço antigo do check-in
    location ~ ^/(memorial/)?checkin/?$ {
        return 301 /check-in/$is_args$args;
    }

    # Totem (SPA): /memorial/sala/1 … 6 e o resto de /memorial/ caem no index.html
    location = /memorial {
        return 301 /memorial/$is_args$args;
    }
    location /memorial/ {
        add_header Cache-Control "no-cache";
        try_files $uri /memorial/index.html;
    }

    # Em produção a raiz é do site atual da escola (nginx/prod/16-site-atual.envsh); aqui vai para o totem.
    location = / {
        if ($arg_sala ~ "^[1-6]$") {
            return 301 /memorial/sala/$arg_sala;
        }
        return 302 /memorial/;
    }
    location / {
        return 404;
    }
}
