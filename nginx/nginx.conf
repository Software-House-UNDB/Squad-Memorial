upstream backend {
    server backend:8000;
}

# Respeita o https que o túnel/proxy já terminou (senão o Django acha que é http e o admin falha no CSRF)
map $http_x_forwarded_proto $proto_real {
    default $scheme;
    https   https;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Padrão pequeno; cada rota que recebe arquivo abre o seu limite (abaixo).
    client_max_body_size 1m;
    client_body_timeout 600s;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ---------- Django ----------
    # Check-in pelo celular: até 3 fotos de 10 MB cada.
    location = /api/memorial/checkin/ {
        client_max_body_size 30m;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_real;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_real;
        proxy_read_timeout 60s;
    }

    # Admin: envio de vídeos grandes.
    location /admin/ {
        client_max_body_size 2G;
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_real;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # ---------- Fotos e vídeos ----------
    # O nginx já responde requisições Range, então o <video> do totem
    # consegue avançar/voltar sem baixar o arquivo inteiro.
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
    }

    # Fotos de ex-alunos: cache curto, para um pedido de remoção chegar logo aos totens.
    location /media/alunos/ {
        alias /var/www/media/alunos/;
        add_header Cache-Control "public, max-age=3600";
        add_header Access-Control-Allow-Origin "*";
    }

    # Arquivos estáticos do admin do Django
    location /static/ {
        alias /var/www/static/;
        expires 30d;
    }

    # ---------- Apps ----------
    # Arquivos com hash no nome: cache eterno
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker e páginas nunca em cache, senão o totem não recebe versões novas
    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        types { application/javascript js; application/manifest+json webmanifest; text/html html; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Check-in pelo celular: página própria (fora do service worker do totem)
    location = /checkin {
        add_header Cache-Control "no-cache";
        try_files /checkin/index.html =404;
    }
    location /checkin/ {
        add_header Cache-Control "no-cache";
        try_files $uri /checkin/index.html;
    }

    # Totem (SPA): qualquer outra rota cai no index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
