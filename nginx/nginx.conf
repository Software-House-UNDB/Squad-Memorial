upstream backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    client_max_body_size 2G;
    client_body_timeout 600s;

    sendfile on;
    tcp_nopush on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API e admin (Django)
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Fotos e vídeos (nginx já responde Range para o <video>)
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Access-Control-Allow-Origin "*";
    }

    # Estáticos do admin do Django
    location /static/ {
        alias /var/www/static/;
        expires 30d;
    }

    # App do totem: arquivos com hash no nome, cache eterno
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker e index nunca em cache
    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js|manifest\.webmanifest|index\.html)$ {
        types { application/javascript js; application/manifest+json webmanifest; text/html html; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: qualquer outra rota cai no index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}