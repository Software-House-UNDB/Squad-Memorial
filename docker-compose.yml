services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - media:/app/media
      - static:/app/static
    depends_on:
      db:
        condition: service_healthy

  # nginx com o build do frontend do totem embutido (ver nginx/Dockerfile)
  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - media:/var/www/media:ro
      - static:/var/www/static:ro
    depends_on:
      - backend

  # Túnel https para o Vercel alcançar o servidor (opcional):
  #   docker compose --profile tunel up -d
  # Precisa de TUNNEL_TOKEN no .env (Cloudflare Zero Trust > Networks > Tunnels).
  # No painel do túnel, aponte o hostname público para http://nginx:80
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - nginx

volumes:
  pgdata:
  media:
  static: