# Backend (Django): lint (Ruff), contratos de arquitetura (import-linter), migrações e testes com cobertura no PostgreSQL.
name: Backend

on:
  push:
    branches: [main, feats]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint e arquitetura
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (estilo, bugs e segurança)
        run: ruff check --output-format=github .
      - name: Contratos de arquitetura (import-linter)
        run: lint-imports

  testes:
    name: Testes (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: memorial
          POSTGRES_USER: memorial
          POSTGRES_PASSWORD: memorial
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U memorial" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: memorial
      POSTGRES_USER: memorial
      POSTGRES_PASSWORD: memorial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: ffmpeg (capa e duração dos vídeos)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - name: Nenhuma migração faltando
        run: python manage.py makemigrations --check --dry-run
      - name: Testes com cobertura
        run: |
          coverage run manage.py test memorial
          coverage report
          coverage xml -o coverage.xml
      - name: Enviar cobertura ao Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
