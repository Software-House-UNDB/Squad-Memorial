# Padrão do título do PR (Conventional Commits), que vira a mensagem do squash merge.
# Regras em frontend/commitlint.config.mjs. Os commits do dia a dia ficam livres.
name: Título do PR

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Conferir o título
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITULO" | npx commitlint --verbose || {
            echo "::error title=Título do PR fora do padrão::Use 'tipo(escopo): descrição', ex.: 'feat(check-in): confirma o e-mail com código'. Tipos: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            exit 1
          }
