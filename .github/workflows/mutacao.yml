# Testes de mutação (Stryker) nas regras do frontend. Demorado demais para cada PR: roda toda segunda e sob demanda.
# O relatório HTML fica como artefato; abaixo de `break` (frontend/stryker.config.mjs) o job falha.
name: Mutação

on:
  schedule:
    - cron: "0 9 * * 1" # segunda, 6h em Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:mutacao
      - name: Relatório
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mutacao
          path: frontend/reports/mutation/
          retention-days: 30
